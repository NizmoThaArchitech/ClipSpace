
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>ClipSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #000000;
        color: #f9fafb;
        overflow-y: hidden; /* Prevent body scroll, handled by internal divs */
      }
      /* For scrollable stats */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
       /* Fade-out effect for scroll containers */
      .fade-scroll-container {
        position: relative;
      }
      .fade-scroll-container::before,
      .fade-scroll-container::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40px; /* Adjust width of fade */
        z-index: 2;
        pointer-events: none;
      }
      .fade-scroll-container::before {
        left: 0;
        background: linear-gradient(to right, #1f2937, transparent);
      }
      .fade-scroll-container::after {
        right: 0;
        background: linear-gradient(to left, #1f2937, transparent);
      }
      /* Styles for card flip animation */
      .flip-card {
        perspective: 1000px;
        background-color: transparent;
      }
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.7s;
        transform-style: preserve-3d;
      }
      .flip-card.is-flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* Safari */
        backface-visibility: hidden;
        border-radius: 0.5rem;
        overflow: hidden;
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }
      
      /* Mobile Menu Animations */
      #app-container.menu-open {
        transform: scale(0.95) translateX(10%);
        filter: blur(4px) brightness(0.7);
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
      }
      .mobile-menu-item {
        animation: fadeIn 0.5s ease-out forwards;
        opacity: 0;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
