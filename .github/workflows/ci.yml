name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --if-present

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test --if-present

  python-check:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements (verbose + retry)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          MAX=3
          for i in $(seq 1 $MAX); do
            echo "Attempt $i of $MAX: pip install requirements"
            if python -m pip install -r requirements.txt --verbose --no-cache-dir; then
              echo "pip install succeeded"
              exit 0
            fi
            echo "pip install failed, sleeping and retrying..."
            sleep $((i*5))
          done
          echo "pip install failed after $MAX attempts"
          exit 1
        shell: bash
      - name: Check model URL
        run: python scripts/check_weights.py --model https://github.com/xinntao/Real-ESRGAN/releases/download/v0.3.0/RealESRGAN_x4plus.pth
      - name: Show pyright & python info
        run: |
          python -m pyright --version || true
          python -c "import sys; print('python', sys.version)"
          python -c "import platform; print('platform:', platform.platform())"
          python -c "import os; print('PYRIGHT_PYTHON_FORCE_VERSION=', os.environ.get('PYRIGHT_PYTHON_FORCE_VERSION'))"
        shell: bash
      - name: Run simple static checks
        run: python -m pyright --warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, python-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Upload build artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build || dist || public
